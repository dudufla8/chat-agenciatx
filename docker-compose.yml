version: '3.8'

services:
  # 1. Aplicação Principal Next.js + Node.js + Socket.io
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxi_omnichannel_app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://user_taxi:senha_forte@postgres:5432/taxidespatch_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-chave_super_secreta_para_operadores_jwt_987654321}
      DRIVER_SSO_SECRET: ${DRIVER_SSO_SECRET:-chave_compartilhada_com_app_do_motorista_taxi_digital_2026}
      TAXI_DIGITAL_API_URL: ${TAXI_DIGITAL_API_URL:-https://api.taxidigital.com.br/v1}
      TAXI_DIGITAL_API_TOKEN: ${TAXI_DIGITAL_API_TOKEN:-token_de_comunicacao_taxi_digital}
      DOMAIN_NAME: ${DOMAIN_NAME:-chat.agenciatx.ia.br}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID}
      META_WA_ACCESS_TOKEN: ${META_WA_ACCESS_TOKEN}
      META_WA_WEBHOOK_VERIFY_TOKEN: ${META_WA_WEBHOOK_VERIFY_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - taxi_network

  # 2. Banco de Dados PostgreSQL 16 Alpine
  postgres:
    image: postgres:16-alpine
    container_name: taxi_postgres
    restart: always
    environment:
      POSTGRES_USER: user_taxi
      POSTGRES_PASSWORD: senha_forte
      POSTGRES_DB: taxidespatch_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_taxi -d taxidespatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taxi_network

  # 3. Redis 7 Alpine para Cache e Pub/Sub WebSockets
  redis:
    image: redis:7-alpine
    container_name: taxi_redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - taxi_network

  # 4. Proxy Reverso Nginx (Opcional - caso não use o Apache da VPS)
  # Como a VPS já possui o Apache rodando o WordPress nas portas 80/443,
  # o Apache do host faz o proxy reverso para 127.0.0.1:3000.
  nginx:
    image: nginx:alpine
    container_name: taxi_nginx
    restart: always
    profiles:
      - standalone_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - taxi_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  taxi_network:
    driver: bridge
